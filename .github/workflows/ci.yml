name: CI/CD Pipeline

on:
  push:
    branches: [prod]

jobs:
  validate-commit:
    name: Validate commit message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate commit message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          if ! echo "$COMMIT_MSG" | grep -qE "^(feat|fix|ci|test|refactor|build): .+"; then
            echo "ERROR: Commit message must follow Conventional Commits format"
            echo "Example: feat: add new feature"
            echo "Valid prefixes: feat, fix, docs, ci, test, chore, refactor, style, build"
            exit 1
          fi
          echo "Commit message is valid"

  build-and-publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: validate-commit
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
              ghcr.io/tyyycardoso/hello-world-cicd:${{ github.run_number }}
              ghcr.io/tyyycardoso/hello-world-cicd:latest
